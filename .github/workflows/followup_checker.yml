name: Follow-up Checker

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-followups:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due follow-up processing
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/api/follow-ups/process-due" \
            -H "Authorization: Bearer ${{ secrets.API_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
          && echo "Follow-up check completed successfully" \
          || echo "Follow-up check skipped or failed (non-fatal)"
